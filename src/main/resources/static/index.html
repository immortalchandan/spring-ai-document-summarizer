<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Document Summarizer</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; color: #333; }
        textarea { width: 100%; height: 200px; margin-bottom: 1rem; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px; resize: vertical; }
        select, button { padding: 0.75rem; margin-right: 0.5rem; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; }
        button { background: #007bff; color: white; border: none; font-weight: bold; }
        button:hover { background: #0056b3; }
        #result { white-space: pre-wrap; background: #f8f9fa; padding: 1.5rem; border-radius: 4px; border: 1px solid #dee2e6; min-height: 100px; line-height: 1.6; }
    </style>
</head>
<body>
    <h1>AI Document Summarizer</h1>
    <p>Powered by Java Spring Boot & Google Gemini</p>
    
    <textarea id="textInput" placeholder="Paste your large text document here..."></textarea>
    
    <div>
        <select id="styleSelect">
            <option value="executive_summary">Executive Summary</option>
            <option value="bullet_points">Bullet Points</option>
            <option value="explain_like_im_5">Explain Like I'm 5</option>
        </select>
        <button onclick="generateSummary()" id="submitBtn">Generate Summary</button>
    </div>
    
    <h2>Output:</h2>
    <div id="result">Awaiting text...</div>

    <script>
        async function generateSummary() {
            const text = document.getElementById('textInput').value.trim();
            const style = document.getElementById('styleSelect').value;
            const resultDiv = document.getElementById('result');
            const btn = document.getElementById('submitBtn');
            
            if (!text) {
                alert("Please paste some text first.");
                return;
            }
            
            btn.disabled = true;
            resultDiv.innerText = "Analyzing and compressing text via Gemini AI...";
            
            try {
                const response = await fetch('/api/v1/documents/summarize', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ documentText: text, summaryStyle: style })
                });
                
                const data = await response.json();
                resultDiv.innerText = data.summary || "Error: Invalid response format.";
            } catch (error) {
                resultDiv.innerText = "Failed to connect to the backend API.";
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
